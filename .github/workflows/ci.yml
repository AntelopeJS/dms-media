name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: Run the nightly tier, with the Windows jobs and Stress
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The shared workflow runs the guardrail pack's `pnpm run checks`, the
# frontend unit tests and the extra commands in parallel jobs, at the tier the
# event picks: Linux only, and Windows too in the nightly. A draft pull request
# runs lint and typecheck only and fails `ci / checks`. The extra commands run
# what `checks` does not. The branch rulesets require the `ubuntu` check, which
# aggregates them.
jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    with:
      docs-files: |
        README.md
        docs
        packages/dms-media/README.md
        packages/dms-media/docs
        packages/interface-dms-media/README.md
        packages/interface-dms-media/docs
      docs-typescript-project: packages/interface-dms-media/docs/tsconfig.json
      # The module build also builds the interface: it is the only build of
      # the job, so the test scripts skip their own rebuild (DMS_PREBUILT).
      # The unit and integration suites run in one boot of the DMS stack: a
      # second boot for the integration folder alone would cost more than its
      # tests. `test:reload` boots a real project in watch mode and reloads a
      # consumer and the module itself (#26). `module-locks` fails the job
      # when a test run recorded a module it installed without a committed
      # record in `antelope-lock/`. `test:exports` also packs both packages and checks the tarballs
      # and the README compatibility table, `test:e2e-suite` checks
      # that the e2e kit loads every journey, and `test:formal` model-checks
      # the TLA+ specs of the formal skills. `test:frontend` typechecks the
      # frontend layer against the DMS layer from the `@antelopejs/dms`
      # devDependency.
      extra-commands: |
        export DMS_PREBUILT=1
        pnpm --dir packages/dms-media build
        pnpm --dir packages/interface-dms-media check:exports
        pnpm --dir packages/dms-media test:exports
        pnpm --dir packages/dms-media test:e2e-suite
        pnpm --dir packages/dms-media test:formal
        pnpm --dir packages/dms-media test:playground
        pnpm --dir packages/dms-media test
        pnpm --dir packages/dms-media test:reload
        pnpm --dir packages/dms-media test:frontend
      extra-commands-job: true
      module-locks: true
      renovate-sync: false
      test-job: true
      nightly: ${{ inputs.nightly == true }}
      formal-checks: |
        [
          {"skill": "formal-asset-files"},
          {"skill": "formal-declared-rows"}
        ]
    permissions:
      contents: read

  # ci-node.yml exposes no outputs, so this reads the same tier action and
  # picks the e2e scope from it: nothing on a draft or a promotion of `next`,
  # the whole suite in the merge queue, the nightly, a manual run and a pull
  # request labelled `ci:full`, the @smoke journeys otherwise.
  select:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.e2e.outputs.e2e }}
      shards: ${{ steps.e2e.outputs.shards }}
    steps:
      - id: tier
        uses: AntelopeJS/.github/.github/actions/ci-tier@v2
      - name: Pick the e2e scope from the tier, the event and the labels
        id: e2e
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          EVENT: ${{ github.event_name }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          if [[ "$TIER" == none || "$TIER" == draft ]]; then
            e2e=none shards='[1]'
          elif [[ "$EVENT" =~ ^(merge_group|schedule|workflow_dispatch)$ || "$FULL_LABEL" == true ]]; then
            e2e=full shards='[1, 2, 3]'
          else
            e2e=smoke shards='[1]'
          fi
          echo "e2e=${e2e}" >> "$GITHUB_OUTPUT"
          echo "shards=${shards}" >> "$GITHUB_OUTPUT"
          echo "Tier \`${TIER}\`, e2e \`${e2e}\`" >> "$GITHUB_STEP_SUMMARY"

  # The journeys of e2e/ as a Playwright suite, at the scope `select` picks:
  # the @smoke ones in one job, or every journey in three shards whose blob
  # reports e2e-report merges. Its global setup prepares and starts one
  # run per shard from e2e/journeys.config.ts.
  e2e:
    needs: select
    if: needs.select.outputs.e2e != 'none'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shards) }}
    env:
      E2E: ${{ needs.select.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          echo "DMS_E2E_RUNS=${RUNNER_TEMP}/dms-runs" >> "$GITHUB_ENV"
      # Before setup-node: its pnpm cache resolves the store by running pnpm.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/dms-media/frontend-vue/pnpm-lock.yaml
      # The playground's modules, the mongod binary, Chromium and the
      # dashboard builds the e2e kit caches.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/mongodb-binaries
            ~/.cache/ms-playwright
            e2e/playground/.antelope/cache
          key: e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'e2e/playground/antelope.config.ts') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/dms-e2e/frontend
          key: e2e-frontend-v2-${{ github.sha }}
          restore-keys: e2e-frontend-v2-
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and its system packages
        run: |
          if timeout 240 pnpm exec playwright install --with-deps --only-shell chromium; then
            exit 0
          fi
          echo "::warning::Chromium's system packages did not install: installing the browser alone"
          pnpm exec playwright install --only-shell chromium
      - if: env.E2E == 'smoke'
        run: pnpm e2e --grep @smoke
      # The blob report keeps each test's steps, attachments and traces, so
      # e2e-report merges the shards into one.
      - if: env.E2E == 'full'
        run: pnpm e2e --shard=${{ matrix.shard }}/3 --reporter=blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: e2e/blob-report
      - if: always() && env.E2E == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
            ${{ runner.temp }}/dms-runs/*/evidence
            ${{ runner.temp }}/dms-runs/*/logs
          retention-days: 7

  # One HTML and JSON report of the shards of a full run.
  e2e-report:
    needs: [select, e2e]
    if: always() && needs.select.outputs.e2e == 'full'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/dms-media/frontend-vue/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: e2e/blob-reports
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html,json e2e/blob-reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e/playwright-report
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e/playwright-report/results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  # The single check the branch rulesets require: green only when every job
  # above succeeded, or the scope skipped e2e.
  ubuntu:
    if: always()
    needs: [select, ci, e2e, e2e-report]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - if: >-
          needs.select.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.ci.result == 'skipped' || (needs.select.outputs.e2e != 'none' && needs.e2e.result == 'skipped')
        run: exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  module-locks:
    needs: ci
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    uses: AntelopeJS/.github/.github/workflows/module-locks-renovate.yml@v2
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
  verdict:
    needs: [ci, select, e2e, e2e-report, ubuntu, renovate-sync, module-locks]
    if: ${{ !cancelled() }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi
