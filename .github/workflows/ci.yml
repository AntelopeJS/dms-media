name: ci

on:
  push:
    branches:
      - main
  # No branch filter: the lint wave stacks pull requests on top of each other,
  # and a filter on `main` left every intermediate step ungated -- only the
  # secret scanner ran.
  pull_request:

  workflow_dispatch: null
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The checks job runs the guardrail pack's `pnpm run checks`. The backend and
# frontend jobs run what `checks` does not, in parallel with it. The branch
# rulesets require the `ubuntu` check, which aggregates them.
jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v1-campaign
    with:
      docs-files: |
        README.md
        packages/dms-media/README.md
        packages/dms-media/docs
        packages/interface-dms-media/README.md
        packages/interface-dms-media/docs
      docs-typescript-project: packages/interface-dms-media/docs/tsconfig.json
      # `typecheck` builds the interface, so this checks the exports map
      # against that build.
      extra-commands: pnpm --dir packages/interface-dms-media check:exports
      renovate-sync: false
    permissions:
      contents: read

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The build step below is the only build of the job: the test scripts
      # and the test harness `installCommand` skip their own rebuild.
      DMS_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The AntelopeJS modules the harness packs and installs (dms, mongodb,
      # api...) and the MongoDB binary both tests start. Without them every
      # run downloads the whole stack before the first test.
      - uses: actions/cache@v4
        with:
          path: |
            packages/dms-media/.antelope/cache
            ~/.cache/mongodb-binaries
          key: antelope-${{ runner.os }}-${{ hashFiles('packages/dms-media/src/test/antelope.test.ts', 'packages/dms-media/tests/hot-reload.test.mjs', 'pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/dms-media build
      # The package entry resolves through its exports map, as a runtime
      # embedding the module resolves it (AntelopeJS core's resolvePackage).
      - run: pnpm --dir packages/dms-media test:exports
      # Unit and integration suites in one boot of the DMS stack: a second
      # boot for the integration folder alone would cost more than its tests.
      - run: pnpm --dir packages/dms-media test
      # Boots a real project in watch mode and reloads a consumer and the
      # module itself: dms-media's routes, permissions and pages must stay
      # registered and be evaluated again from the edited files (#26).
      - run: pnpm --dir packages/dms-media test:reload

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/dms-media/frontend-vue/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Typechecks the frontend layer against the DMS layer from the
      # `@antelopejs/dms` devDependency: no running backend needed. The
      # frontend unit tests run in `checks`.
      - run: pnpm --dir packages/dms-media test:frontend

  # The single check the branch rulesets require: green only when every job
  # above succeeded.
  ubuntu:
    if: always()
    needs: [ci, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v1
