name: ci

on:
  push:
    branches:
      - main
  # No branch filter: the lint wave stacks pull requests on top of each other,
  # and a filter on `main` left every intermediate step ungated -- only the
  # secret scanner ran.
  pull_request:

  workflow_dispatch: null
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The shared workflow runs the guardrail pack's `pnpm run checks`, the
# frontend unit tests and the extra commands in parallel jobs, each on Linux
# and on Windows. The extra commands run what `checks` does not. The branch
# rulesets require the `ubuntu` check, which aggregates them.
jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v1
    with:
      docs-files: |
        README.md
        docs
        packages/dms-media/README.md
        packages/dms-media/docs
        packages/interface-dms-media/README.md
        packages/interface-dms-media/docs
      docs-typescript-project: packages/interface-dms-media/docs/tsconfig.json
      # The module build also builds the interface: it is the only build of
      # the job, so the test scripts skip their own rebuild (DMS_PREBUILT).
      # The unit and integration suites run in one boot of the DMS stack: a
      # second boot for the integration folder alone would cost more than its
      # tests. `test:reload` boots a real project in watch mode and reloads a
      # consumer and the module itself (#26). The last command fails when a
      # test run recorded a module it installed without a committed record in
      # `antelope-lock/`: commit what it lists, so every run installs the same
      # graph. `test:frontend` typechecks the frontend layer against the DMS
      # layer from the `@antelopejs/dms` devDependency.
      extra-commands: |
        export DMS_PREBUILT=1
        pnpm --dir packages/dms-media build
        pnpm --dir packages/interface-dms-media check:exports
        pnpm --dir packages/dms-media test:exports
        pnpm --dir packages/dms-media test:playground
        pnpm --dir packages/dms-media test
        pnpm --dir packages/dms-media test:reload
        git status --porcelain --untracked-files=all -- packages/dms-media/antelope-lock | (! grep .)
        pnpm --dir packages/dms-media test:frontend
      extra-commands-job: true
      renovate-sync: false
      test-job: true
      windows: true
    permissions:
      contents: read

  # The single check the branch rulesets require: green only when every job
  # above succeeded.
  ubuntu:
    if: always()
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v1
