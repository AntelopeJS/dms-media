name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release-version:
        description: Stable version to release, set by the release train
        required: false
        type: string
      release-commit:
        description: Commit SHA to release, set by the release train
        required: false
        type: string
      dependency-ranges:
        description: JSON object of stable ranges that replace preview pins, set by the release train
        required: false
        default: "{}"
        type: string
      package-directory:
        description: Directory of the package to release, set by the release train
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release-packages-dms-media:
    if: github.event_name == 'push' || inputs.package-directory == 'packages/dms-media'
    uses: AntelopeJS/.github/.github/workflows/release-npm-public.yml@v2
    with:
      release-version: ${{ inputs.release-version }}
      release-commit: ${{ inputs.release-commit }}
      dependency-ranges: ${{ inputs.dependency-ranges }}
      package-directory: packages/dms-media
    secrets:
      RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}

  release-packages-interface-dms-media:
    if: github.event_name == 'push' || inputs.package-directory == 'packages/interface-dms-media'
    uses: AntelopeJS/.github/.github/workflows/release-npm-public.yml@v2
    with:
      release-version: ${{ inputs.release-version }}
      release-commit: ${{ inputs.release-commit }}
      dependency-ranges: ${{ inputs.dependency-ranges }}
      package-directory: packages/interface-dms-media
    secrets:
      RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
